services:
  - type: web
    name: taskflow-web
    env: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString
      - key: REDIS_URL
        value: redis://taskflow-redis:6379/0
      - key: CELERY_BROKER_URL
        value: redis://taskflow-redis:6379/1
      - key: CELERY_RESULT_BACKEND
        value: redis://taskflow-redis:6379/1
    plan: free

  - type: worker
    name: taskflow-worker
    env: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: celery -A app.worker.celery_app worker --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString
      - key: REDIS_URL
        value: redis://taskflow-redis:6379/0
      - key: CELERY_BROKER_URL
        value: redis://taskflow-redis:6379/1
      - key: CELERY_RESULT_BACKEND
        value: redis://taskflow-redis:6379/1
    plan: free

  - type: worker
    name: taskflow-beat
    env: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: celery -A app.worker.celery_app beat --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString
      - key: REDIS_URL
        value: redis://taskflow-redis:6379/0
      - key: CELERY_BROKER_URL
        value: redis://taskflow-redis:6379/1
      - key: CELERY_RESULT_BACKEND
        value: redis://taskflow-redis:6379/1
    plan: free

  - type: pserv
    name: taskflow-redis
    env: image
    image:
      url: redis:7-alpine
    plan: free

databases:
  - name: taskflow-db
    plan: free
